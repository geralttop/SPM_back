version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3 # Версия Postgres 15 с PostGIS 3.3
    container_name: spm
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: my_secret_password
      POSTGRES_DB: geo_map_app
    ports:
      - "5432:5432" # Пробрасываем порт, чтобы pgAdmin и Nest.js видели базу
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
